[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zebra_day"
dynamic = ["version"]
description = "A Python library to manage a Zebra printer fleet and an API for ZPL print requests."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "John Major", email = "john@daylilyinformatics.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: System :: Hardware",
]
keywords = ["zebra", "printer", "zpl", "label", "barcode", "fleet"]

dependencies = [
    "yaml-config-day>=0.0.5",
    "requests>=2.28.0",
    "pytz>=2023.3",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.2.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "cli-core-yo==2.0.0",
    "daylily-auth-cognito==2.0.1",
    "daylily-tapdb==5.0.0",
    "typer>=0.21.0,<0.22.0",
    "rich>=14.0.0,<15.0.0",
    "pillow>=10.0.0",
    "zint-bindings>=1.2.0",
    "httpx",
    "boto3",
    "awscli",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8.0",
    "pre-commit>=3.8.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "pytest-playwright>=0.4.4",
    "ipython>=8.16.0",
    "playwright>=1.40.0",
]
lint = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
aws = [
    "boto3>=1.26.0",
]
auth = [
    "python-jose[cryptography]>=3.3.0",
    "boto3>=1.26.0",
]
all = [
    "zebra_day[dev,lint,docs,auth,aws]",
]

[project.urls]
Homepage = "https://github.com/Daylily-Informatics/zebra_day"
Repository = "https://github.com/Daylily-Informatics/zebra_day.git"
Issues = "https://github.com/Daylily-Informatics/zebra_day/issues"

[project.scripts]
zday = "zebra_day.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zebra_day*"]

[tool.setuptools.package-data]
zebra_day = [
    "bin/*",
    "docs/*.md",
    "etc/*",
    "etc/label_styles/*",
    "etc/label_styles/tmps/*",
    "etc/old_printer_config/*",
    "files/*",
    "static/*",
    "static/js/*",
    "logs/*",
    "templates/*",
    "templates/modern/*",
    "templates/legacy/*",
    "web/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "e2e: live Playwright/Cognito browser tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "UP017",  # prefer datetime.timezone.utc for repo-wide mypy compatibility
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.bandit]
targets = ["zebra_day"]
exclude_dirs = ["tests", "dist", "build"]
skips = ["B101", "B105", "B404", "B603", "B607"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "zebra_day/_version.py"
write_to_template = """__version__ = "{version}"
"""
